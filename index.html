<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        h1 {
            color: beige;
        }

        h3 {
            color: beige;
            padding: 4px;
            text-shadow: 2px 2px rgba(0, 0, 0, 0.4);
            background-color: rgb(182, 69, 58);
            border: 3px solid rgb(195, 77, 67);
            border-radius: 15px;
            box-shadow: 3px 3px rgba(140, 51, 43, 0.8);
        }

        #title {
            margin: none; 
            padding: 10px; 
            text-align: center;
            text-shadow: 2px 2px rgba(0, 0, 0, 0.4);
            background-color: rgba(18, 95, 59, 0.61);
            border: 3px solid rgb(23, 120, 75);
            border-radius: 25px;
            box-shadow: 5px 5px rgba(0, 0, 0, 0.4);
        }

        #guidebox {
            padding: 10px;
            background-color: beige;
            border: 3px solid rgb(254, 254, 232);
            border-radius: 20px;
            box-shadow: 4px 4px rgb(214, 214, 179, 0.8);
        }
    </style>
</head>
<body>
    <div class="container bg-success" style="padding: 25px;">

        <div class="row" id="title">
            <h1><img src="https://cdn-icons-png.flaticon.com/512/2633/2633871.png" alt="badminton image" style="height: 50px; width: 50px;"> A Simple Badminton Guide</h1>
        </div>

        <br>
            <img src="https://cdn-icons-png.flaticon.com/512/1801/1801431.png" alt="badminton" id="bdmintn" style="height: 275px; width: 275px; margin: auto; display: block;">
        <br>

        <div class="row gap-3 justify-content-center">
            <div class="col-lg-3" id="guidebox">
                <h3><img src="https://cdn-icons-png.flaticon.com/512/3557/3557574.png" alt="rules image" style="height: 32                    px; width: 32px;"> The Rules</h3>

                    <li>Court positioning</li>
                    <li>Serving</li>
                    <li>Scoring</li>
                    <li>Faults</li>
                </ul>
            </div>

            <div class="col-lg-3" id="guidebox">

                <ul>
                    <li>Shuttlecock</li>
                    <li>Racket</li>

                <h3><img src="https://cdn-icons-png.flaticon.com/512/217/217871.png" alt="techniques image" style="height: 35px; width: 35px;"> The Techniques</h3>
                <ul>
